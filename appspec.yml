version: 0.0
os: linux

hooks:
  ApplicationStop:
    - location: deploy/scripts/stop_docker.sh
      timeout: 120
      runas: root

  BeforeInstall:
    - location: deploy/scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: deploy/scripts/start_docker.sh
      timeout: 300
      runas: root
